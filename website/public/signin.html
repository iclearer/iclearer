<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · iClearer</title>
  <link rel="icon" href="/assets/png/favicon-32.png" />
  <style>
    :root {
      --bg: #0e141b;
      --card: #171e27;
      --tx: #f2f5f8;
      --mu: #9aa8b6;
      --sky: #7fb8e6;
      --line: rgba(255,255,255,0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1c2a3a, var(--bg));
      color: var(--tx); padding: 24px;
    }
    .card {
      width: min(440px, 100%); background: var(--card); border: 1px solid var(--line);
      border-radius: 20px; padding: 28px; text-align: center;
    }
    img.logo { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 14px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--mu); font-size: 14px; line-height: 1.45; margin: 0 0 14px; }
    .key {
      font-size: 18px; font-weight: 700; letter-spacing: 0.04em;
      background: #10161d; border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 12px; margin: 12px 0 16px; word-break: break-all;
    }
    .btn {
      appearance: none; border: 0; border-radius: 999px; padding: 12px 18px;
      font-weight: 600; font-size: 14px; cursor: pointer; background: var(--sky); color: #06131f;
    }
    .btn.ghost { background: transparent; color: var(--tx); border: 1px solid var(--line); margin-left: 8px; }
    .err { color: #e07070; }
    .ok { color: #8fd49a; }
    .meta { font-size: 13px; color: var(--mu); margin-top: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/png/icon-glass-light-120.png" alt="iClearer" />
    <h1>Sign in to iClearer</h1>
    <p id="status">Checking your link…</p>
    <div id="result" hidden>
      <p>Your license key:</p>
      <div class="key" id="key"></div>
      <button class="btn" id="copy" type="button">Copy key</button>
      <p class="meta">Open the Mac app → <strong>Sign in or activate</strong>, paste your email and this key, then Activate.</p>
      <p class="meta" id="plan"></p>
    </div>
  </main>
  <script>
    const SUPABASE_URL = "https://kzbimjneyhlivsodhpgm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_g0M4nIaak9CkhauA504hRA_wulzYdS7";

    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const email = params.get("email") || "";
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const keyEl = document.getElementById("key");
    const planEl = document.getElementById("plan");

    async function redeem() {
      if (!token || !email) {
        status.className = "err";
        status.textContent = "This sign-in link is missing information. Request a new one from the Mac app.";
        return;
      }
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/license-api`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ action: "redeem_signin", email, token }),
        });
        const data = await res.json();
        if (!data.ok) {
          status.className = "err";
          status.textContent = data.error || "This sign-in link is invalid or expired.";
          return;
        }
        status.className = "ok";
        status.textContent = data.message || "Ready — copy your key below.";
        keyEl.textContent = data.key;
        planEl.textContent = `Email: ${data.email} · Plan: ${data.plan}`;
        result.hidden = false;
      } catch (e) {
        status.className = "err";
        status.textContent = "Could not reach the license server. Try again in a moment.";
      }
    }

    document.getElementById("copy").addEventListener("click", async () => {
      const key = keyEl.textContent || "";
      try {
        await navigator.clipboard.writeText(key);
        document.getElementById("copy").textContent = "Copied";
      } catch {
        document.getElementById("copy").textContent = "Select & copy the key";
      }
    });

    redeem();
  </script>
</body>
</html>
